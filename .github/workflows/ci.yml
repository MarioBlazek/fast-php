name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]
        include:
          - os: macos-latest
            php: "8.5"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, mbstring
          coverage: none
          tools: composer
      - name: Pin one LLVM for bindgen (Linux)
        if: runner.os == 'Linux'
        # ext-php-rs runs bindgen on PHP's headers. The runner has several LLVMs, and loading
        # libclang from one while taking clang's built-in headers from another breaks on the
        # SSE intrinsics. Use the newest LLVM that ships a libclang, for both.
        run: |
          for d in $(ls -d /usr/lib/llvm-*/ | sort -V -r); do
            if ls "$d"lib/libclang*.so* >/dev/null 2>&1 && [ -x "$d"bin/clang ]; then
              echo "LIBCLANG_PATH=${d}lib" >> "$GITHUB_ENV"
              echo "CLANG_PATH=${d}bin/clang" >> "$GITHUB_ENV"
              echo "using $d"
              break
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: php-${{ matrix.php }}
      - name: fmt and clippy
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --release --all-targets -- -D warnings
      - name: Rust tests
        working-directory: rust
        run: cargo test --release
      - name: Composer install
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: Spikes (round-trip, observer profiler, crossing cost)
        run: sh spike/run.sh
      - name: End to end (scan, wrong port rejected, port, verify, enable, bench, disable)
        run: sh tests/e2e.sh
