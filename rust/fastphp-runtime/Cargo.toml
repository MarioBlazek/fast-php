[package]
name = "fastphp-runtime"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "fast-php's profiler: a PHP extension that times every user function through the Zend observer API."

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = { workspace = true, features = ["observer"] }
