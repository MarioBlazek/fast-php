[workspace]
resolver = "3"
members = ["fastphp-value", "fastphp-std", "fastphp-runtime", "std-check", "spike-ext", "spike-ffi"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ext-php-rs = "0.16.5"
indexmap = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
