[package]
name = "fastphp-std"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PHP's builtins in Rust, matching PHP byte for byte: what ports call instead of Rust's own string and number functions."

[dependencies]
fastphp-value = { path = "../fastphp-value" }
pcre2 = "0.2.11"
memchr = "2"
md-5 = "0.11.0"
sha1 = "0.11.0"
